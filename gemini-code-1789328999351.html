<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anonymous Questions</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161a22;
      --border: #29303d;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --text: #f0f2f5;
      --text-muted: #8a96a3;
      --success: #2ec4b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtext {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: #0e1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s ease;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .link-box {
      display: flex;
      gap: 8px;
    }

    .link-box input {
      flex: 1;
    }

    .copy-btn {
      width: auto;
      padding: 0 16px;
      white-space: nowrap;
    }

    .inbox {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .question-card {
      background: #0e1117;
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .status-msg {
      color: var(--success);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- View 1: Send a Question (When opening via shared link) -->
    <div id="ask-view">
      <h1 id="recipient-heading">Ask a Question</h1>
      <p class="subtext">Send an anonymous message. Your identity will remain secret.</p>
      
      <div class="input-group">
        <textarea id="question-input" placeholder="Type your secret question here..."></textarea>
        <button id="send-btn">Send Anonymously</button>
      </div>
      <p id="sent-status" class="status-msg">Sent! Your question has been delivered.</p>
    </div>

    <!-- View 2: Dashboard (Generate Link & View Inbox) -->
    <div id="owner-view">
      <div class="divider"></div>
      <div class="section-title">Your Share Link</div>
      <div class="link-box">
        <input type="text" id="share-link" readonly placeholder="Enter username above..." />
        <button class="copy-btn" id="copy-btn">Copy</button>
      </div>

      <div class="divider"></div>
      <div class="section-title">Inbox (Received Questions)</div>
      <div class="inbox" id="inbox-list">
        <p class="subtext" style="text-align: left;">No questions received yet.</p>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUser = urlParams.get('user');

    const askView = document.getElementById('ask-view');
    const recipientHeading = document.getElementById('recipient-heading');
    const questionInput = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');
    const sentStatus = document.getElementById('sent-status');

    const shareLinkInput = document.getElementById('share-link');
    const copyBtn = document.getElementById('copy-btn');
    const inboxList = document.getElementById('inbox-list');

    // 1. Setup based on URL parameters
    let currentUsername = targetUser || localStorage.getItem('anon_username');

    if (!currentUsername) {
      currentUsername = 'user_' + Math.random().toString(36).substring(2, 8);
      localStorage.setItem('anon_username', currentUsername);
    }

    // Set shareable URL
    const baseUrl = window.location.origin + window.location.pathname;
    const fullShareUrl = `${baseUrl}?user=${currentUsername}`;
    shareLinkInput.value = fullShareUrl;

    if (targetUser) {
      recipientHeading.textContent = `Ask @${targetUser} Anything`;
    } else {
      recipientHeading.textContent = `Ask Me Anything`;
    }

    // 2. Load Inbox from LocalStorage
    function loadInbox() {
      const stored = JSON.parse(localStorage.getItem(`questions_${currentUsername}`) || '[]');
      if (stored.length === 0) {
        inboxList.innerHTML = '<p class="subtext" style="text-align: left;">No questions received yet.</p>';
        return;
      }
      inboxList.innerHTML = '';
      stored.reverse().forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
          <div>${escapeHtml(q.text)}</div>
          <div class="timestamp">${new Date(q.timestamp).toLocaleString()}</div>
        `;
        inboxList.appendChild(card);
      });
    }

    // 3. Send Question Handler
    sendBtn.addEventListener('click', () => {
      const text = questionInput.value.trim();
      if (!text) return;

      const stored = JSON.parse(localStorage.getItem(`questions_${currentUsername}`) || '[]');
      stored.push({
        text: text,
        timestamp: new Date().toISOString()
      });

      localStorage.setItem(`questions_${currentUsername}`, JSON.stringify(stored));
      questionInput.value = '';
      
      sentStatus.style.display = 'block';
      setTimeout(() => { sentStatus.style.display = 'none'; }, 3000);

      loadInbox();
    });

    // 4. Copy Link Handler
    copyBtn.addEventListener('click', () => {
      shareLinkInput.select();
      navigator.clipboard.writeText(shareLinkInput.value);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
    });

    // Utility: prevent basic XSS script injections
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    loadInbox();
  </script>
</body>
</html>
